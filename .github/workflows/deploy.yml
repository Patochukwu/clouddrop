name: Deploy CloudDrop to EC2

on:
  push:
    branches: [clouddrop]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install server dependencies
        run: |
          cd server
          npm ci

      - name: Build React client
        run: |
          cd client
          npm ci
          npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/clouddrop

            # Force-sync to latest remote state (avoids merge conflicts from local file changes)
            git fetch origin clouddrop
            git checkout clouddrop
            git reset --hard origin/clouddrop

            # Install server deps
            cd server && npm ci && cd ..

            # Install and build client
            cd client && npm ci && VITE_API_URL=/api npm run build && cd ..

            # Restart the server process (or start it fresh if not running)
            pm2 describe clouddrop-server > /dev/null 2>&1 \
              && pm2 restart clouddrop-server \
              || pm2 start /home/ubuntu/clouddrop/server/server.js --name clouddrop-server

            pm2 save
