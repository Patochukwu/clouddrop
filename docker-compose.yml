services:
  postgres:
    image: postgres:16-alpine
    container_name: clouddrop_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: clouddrop
    ports:
      - '5432:5432'
    volumes:
      - clouddrop_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  clouddrop_pgdata:
